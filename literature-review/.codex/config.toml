[mcp_servers.zotero]
command = "uv"
args = [
    "run",
    "--link-mode",
    "copy",
    "--no-project",
    "--with",
    "zotero-mcp-server[semantic,pdf]==0.6.3",
    "python",
    "-c",
    "import runpy; from pathlib import Path; roots=(Path.cwd(), *Path.cwd().parents); repo=next((p for p in roots if (p/'.codex/config.toml').is_file() and (p/'scripts/zotero-mcp-launcher.py').is_file()), None); repo is not None or (_ for _ in ()).throw(RuntimeError('literature-review repository root not found')); runpy.run_path(str(repo/'scripts/zotero-mcp-launcher.py'), run_name='__main__')",
]
startup_timeout_sec = 60
tool_timeout_sec = 120
